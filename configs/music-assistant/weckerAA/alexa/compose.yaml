services:
  music-assistant-alexa-skill:
    image: ghcr.io/alams154/music-assistant-skill:latest
    container_name: music-assistant-alexa-skill
    restart: unless-stopped

    environment:
      SKILL_HOSTNAME: ${ALEXA_SKILL_HOSTNAME:?Set ALEXA_SKILL_HOSTNAME in .env}
      MA_HOSTNAME: ${MA_STREAM_URL:?Set MA_STREAM_URL in .env}
      APP_USERNAME: /run/secrets/APP_USERNAME
      APP_PASSWORD: /run/secrets/APP_PASSWORD
      PORT: "5000"
      LOCALE: ${ALEXA_LOCALE:-en-US}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      TZ: ${TZ:-America/Los_Angeles}

    # The API remains private. MA reaches it through its host network, while
    # cloudflared on weckerAA forwards the public skill hostname to this port.
    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - ./ask_data:/root/.ask

    secrets:
      - APP_USERNAME
      - APP_PASSWORD

secrets:
  APP_USERNAME:
    file: ./secrets/app_username.txt
  APP_PASSWORD:
    file: ./secrets/app_password.txt
